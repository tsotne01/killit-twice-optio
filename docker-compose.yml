name: killit-twice-optio

services:
  postgres:
    image: postgres:16-alpine
    container_name: optio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: optio_db
      POSTGRES_USER: optio_user
      POSTGRES_PASSWORD: optio_password
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optio_user -d optio_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - optio-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: optio-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    networks:
      - optio-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: optio-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: optio_user
      RABBITMQ_DEFAULT_PASS: optio_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - optio-network

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: optio-pipeline
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: optio_db
      POSTGRES_USER: optio_user
      POSTGRES_PASSWORD: optio_password
      ELASTICSEARCH_NODE: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: customers
      RABBITMQ_URL: amqp://optio_user:optio_password@rabbitmq:5672
      RABBITMQ_EXCHANGE: customer.events
      RABBITMQ_QUEUE: customer.events.audit_queue
      PIPELINE_BATCH_SIZE: 500
      PIPELINE_POLL_INTERVAL_MS: 1000
      API_PORT: 4000
    ports:
      - "4000:4000"
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - optio-network

volumes:
  postgres_data:
  elasticsearch_data:
  rabbitmq_data:

networks:
  optio-network:
    driver: bridge
